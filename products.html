<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Products | Naham Stores</title>
    <style>
        /* ===== GLOBAL STYLES - MATCHING PROFILE PAGE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6a0dad;
            --primary-dark: #4b0082;
            --primary-light: #f0e6ff;
            --secondary: #E67E22;
            --secondary-light: #fdf2e6;
            --dark: #1e1e2f;
            --gray: #f5f5f5;
            --card-radius: 28px;
            --shadow-sm: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 32px rgba(106, 13, 173, 0.12);
        }

        body {
          background-image: url(logo.png);
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            color: var(--dark);
            line-height: 1.4;
        }

        /* Header - compact like profile */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            background: white;
            padding: 8px 24px;
            border-radius: 60px;
            margin: 16px 20px 0 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(106,13,173,0.08);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links li a {
            text-decoration: none;
            font-weight: 500;
            color: var(--dark);
            transition: 0.2s;
            padding: 6px 0;
        }

        .nav-links li a:hover {
            color: var(--primary);
            border-bottom: 2px solid var(--secondary);
        }

        .header-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .cart-icon, .user-icon {
            font-size: 1.5rem;
            cursor: pointer;
            background: var(--primary-light);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            transition: 0.2s;
            position: relative;
        }

        .cart-icon:hover, .user-icon:hover {
            background: var(--primary);
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--secondary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container */
        .container {
            max-width: 1280px;
            margin: 28px auto;
            padding: 0 24px 80px 24px;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, var(--primary-light) 0%, white 100%);
            border-radius: var(--card-radius);
            padding: 40px 32px;
            margin-bottom: 32px;
            text-align: center;
            border: 1px solid rgba(106,13,173,0.1);
        }

        .hero-banner h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 12px;
        }

        .hero-banner p {
            color: #555;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            background: white;
            padding: 12px 20px;
            border-radius: 80px;
            box-shadow: var(--shadow-sm);
        }

        .filter-bar select, .filter-bar input {
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid #e2e2e2;
            font-size: 14px;
            background: white;
            transition: all 0.2s;
        }

        .filter-bar select:focus, .filter-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(106,13,173,0.1);
        }

        .filter-bar input {
            flex: 1;
            min-width: 200px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
        }

        .product-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(106,13,173,0.06);
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .product-card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .product-card-image {
            transform: scale(1.02);
        }

        .product-card-body {
            padding: 18px;
        }

        .product-card-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--dark);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-card-price {
            color: var(--secondary);
            font-weight: 700;
            font-size: 1.25rem;
            margin: 8px 0;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: var(--card-radius);
            color: #888;
        }

        .empty-state h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* Toast Message */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            z-index: 1100;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
        }

        /* Mobile Navigation */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background:var(--dark);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(230,126,34,0.2);
            padding: 10px 16px;
            justify-content: space-around;
            z-index: 1000;
        }

        .mobile-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--dark);
            transition: color 0.2s;
            color: white;
        }

        .mobile-nav .nav-item i {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .mobile-nav .nav-item:hover {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .mobile-nav {
                display: flex;
            }
            .container {
                padding-bottom: 90px;
            }
            .header-container {
                margin: 12px;
            }
            .hero-banner {
                padding: 28px 20px;
            }
            .hero-banner h1 {
                font-size: 1.6rem;
            }
            .filter-bar {
                border-radius: 32px;
                padding: 12px 16px;
            }
            .products-grid {
                gap: 18px;
            }
        }

        @media (max-width: 480px) {
            .filter-bar select, .filter-bar input {
                width: 100%;
            }
            .filter-bar {
                flex-direction: column;
                border-radius: 28px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🍳 Naham Stores</div>
            <ul class="nav-links">
                <li><a href="cart.html">🛒 Cart</a></li>
                <li><a href="user-chat.html">💬 Message</a></li>
                <li><a href="profile.html">💻 About Us</a></li>
                <li><a href="login.html">🏪 Admin</a></li>
            </ul>
            <div class="header-icons">
                <div class="cart-icon" onclick="window.location.href='cart.html'">🛒<span class="cart-count" id="cartCount">0</span></div>
                <div class="user-icon" onclick="window.location.href='user-profile.html'">👤</div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero-banner">
            <h1>✨ Premium Kitchen Essentials</h1>
            <p>Discover high-quality cookware, cutlery, bakeware and more. Elevate your cooking experience with Naham Stores.</p>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <select id="categoryFilter">
                <option value="">📂 All Categories</option>
                <option value="cookware">🍲 Cookware</option>
                <option value="cutlery">🔪 Cutlery</option>
                <option value="bakeware">🧁 Bakeware</option>
                <option value="utensils">🥄 Utensils</option>
                <option value="storage">📦 Storage</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 Search products by name or description...">
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="mobile-nav">
        <a href="cart.html" class="nav-item"><i>🛒</i><span>Cart</span></a>
        <a href="user-chat.html" class="nav-item"><i>💬</i><span>Message</span></a>
        <a href="profile.html" class="nav-item"><i>💻</i><span>About</span></a>
        <a href="login.html" class="nav-item"><i>🏪</i><span>Admin</span></a>
    </div>

    <div id="toastMsg" class="toast" style="display:none"></div>

    <script>
        // Mock products data (fallback if localStorage is empty)
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: "Premium Stainless Cookware Set", category: "cookware", price: 18900, quantity: 12, description: "Professional 5-piece cookware set with non-stick coating.", images: ["https://images.unsplash.com/photo-1584990347449-8c5e1d7d8c8a?w=300&h=220&fit=crop"] },
            { id: 2, name: "Professional Chef Knife", category: "cutlery", price: 4500, quantity: 25, description: "High-carbon stainless steel chef's knife.", images: ["https://images.unsplash.com/photo-1593615698835-1a6b8b6b6f6a?w=300&h=220&fit=crop"] },
            { id: 3, name: "Non-Stick Frying Pan", category: "cookware", price: 6500, quantity: 18, description: "Durable non-stick frying pan, PFOA-free.", images: ["https://images.unsplash.com/photo-1584990347449-8c5e1d7d8c8a?w=300&h=220&fit=crop"] },
            { id: 4, name: "Silicone Baking Mat Set", category: "bakeware", price: 3200, quantity: 40, description: "Reusable non-stick baking mats, set of 2.", images: ["https://images.unsplash.com/photo-1584990347449-8c5e1d7d8c8a?w=300&h=220&fit=crop"] },
            { id: 5, name: "Stainless Steel Mixing Bowls", category: "utensils", price: 5500, quantity: 22, description: "Set of 5 nesting mixing bowls with lids.", images: ["https://images.unsplash.com/photo-1584990347449-8c5e1d7d8c8a?w=300&h=220&fit=crop"] },
            { id: 6, name: "Airtight Food Storage Containers", category: "storage", price: 4200, quantity: 35, description: "BPA-free 10-piece container set.", images: ["https://images.unsplash.com/photo-1584990347449-8c5e1d7d8c8a?w=300&h=220&fit=crop"] }
        ];

        // Helper functions
        function showToast(message) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            const cartCountSpan = document.getElementById('cartCount');
            if (cartCountSpan) cartCountSpan.innerText = totalItems;
        }

        function addToCart(productId, quantity = 1) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + quantity;
            } else {
                cart.push({ id: productId, quantity: quantity });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showToast('✅ Added to cart!');
        }

        // Display products
        function displayProducts(productsToShow) {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;

            if (productsToShow.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>🍽️ No products found</h3>
                        <p>Try adjusting your search or browse all categories</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = productsToShow.map(product => `
                <div class="product-card" onclick="window.location.href='product-details.html?id=${product.id}'">
                    <img src="${product.images && product.images[0] ? product.images[0] : 'https://via.placeholder.com/300x220?text=No+Image'}" 
                         alt="${product.name}" 
                         class="product-card-image"
                         onerror="this.src='https://via.placeholder.com/300x220?text=Image+Not+Found'">
                    <div class="product-card-body">
                        <div class="product-card-title">${escapeHtml(product.name)}</div>
                        <div class="product-card-price">₦${product.price.toLocaleString()}</div>
                        <button class="btn-outline" onclick="event.stopPropagation(); addToCart(${product.id})">
                            🛒 Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Filter products based on category and search
        function filterProducts() {
            const category = document.getElementById('categoryFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = [...products];

            if (category) {
                filtered = filtered.filter(p => p.category === category);
            }

            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) || 
                    (p.description && p.description.toLowerCase().includes(searchTerm))
                );
            }

            displayProducts(filtered);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
            filterProducts();

            const categoryFilter = document.getElementById('categoryFilter');
            const searchInput = document.getElementById('searchInput');

            if (categoryFilter) categoryFilter.addEventListener('change', filterProducts);
            if (searchInput) searchInput.addEventListener('input', filterProducts);
        });

        // Expose functions to global scope for inline onclick
        window.addToCart = addToCart;
        window.updateCartCount = updateCartCount;
        window.filterProducts = filterProducts;

        // Listen for cart updates from other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === 'cart') {
                updateCartCount();
            }
            if (e.key === 'products') {
                products = JSON.parse(localStorage.getItem('products')) || products;
                filterProducts();
            }
        });
    </script>
</body>
</html>
