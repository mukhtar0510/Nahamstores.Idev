<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Product Details | Naham Stores</title>
    <style>
        /* ===== GLOBAL STYLES - MATCHING PROFILE PAGE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6a0dad;
            --primary-dark: #4b0082;
            --primary-light: #f0e6ff;
            --secondary: #E67E22;
            --secondary-light: #fdf2e6;
            --dark: #1e1e2f;
            --gray: #f5f5f5;
            --card-radius: 28px;
            --shadow-sm: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 32px rgba(106, 13, 173, 0.12);
        }

        body {
           background-image: url(logo.png);
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            color: var(--dark);
            line-height: 1.4;
        }

        /* Header - compact like profile */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            background: white;
            padding: 8px 24px;
            border-radius: 60px;
            margin: 16px 20px 0 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(106,13,173,0.08);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links li a {
            text-decoration: none;
            font-weight: 500;
            color: var(--dark);
            transition: 0.2s;
            padding: 6px 0;
        }

        .nav-links li a:hover {
            color: var(--primary);
            border-bottom: 2px solid var(--secondary);
        }

        .header-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .cart-icon {
            font-size: 1.5rem;
            cursor: pointer;
            background: var(--primary-light);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            transition: 0.2s;
            position: relative;
        }

        .cart-icon:hover {
            background: var(--primary);
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--secondary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1280px;
            margin: 28px auto;
            padding: 0 24px 80px 24px;
        }

        /* Product Detail Card */
        .product-detail-page {
            background: white;
            border-radius: var(--card-radius);
            padding: 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(106,13,173,0.06);
        }

        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .thumbnail-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .thumbnail-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 16px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .thumbnail-img.active {
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(106,13,173,0.2);
        }

        .main-img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            background: var(--gray);
            border-radius: 24px;
            padding: 20px;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-light);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            color: var(--primary);
        }

        .quantity-btn:hover {
            background: var(--primary);
            color: white;
        }

        .price-badge {
            background: linear-gradient(135deg, var(--dark) 0%, #2c2c3a 100%);
            padding: 16px 20px;
            border-radius: 24px;
            margin: 16px 0;
        }

        .seller-info {
            margin-top: 24px;
            padding: 18px;
            background: var(--primary-light);
            border-radius: 24px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(106,13,173,0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #d35400;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
        }

        .reviews-section {
            margin-top: 32px;
            background: white;
            border-radius: var(--card-radius);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-md);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            color: var(--primary);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e2e2;
            border-radius: 30px;
            font-size: 14px;
        }

        .form-group textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .star-selector {
            font-size: 2rem;
            color: var(--secondary);
            cursor: pointer;
            letter-spacing: 4px;
        }

        /* Mobile */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(230,126,34,0.2);
            padding: 10px 16px;
            justify-content: space-around;
            z-index: 1000;
           
        }

        .mobile-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 1100;
            font-size: 0.85rem;
        }

        @media (min-width: 768px) {
            .product-detail-page {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 32px;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .mobile-nav {
                display: flex;
            }
            .container {
                padding-bottom: 90px;
            }
            .header-container {
                margin: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🍳 Naham Stores</div>
            <ul class="nav-links">
                <li><a href="products.html">🏠 Home</a></li>
                <li><a href="profile.html">💻 About</a></li>
                <li><a href="cart.html">🛒 Cart</a></li>
                <li><a href="user-chat.html">💬 Contact</a></li>
            </ul>
            <div class="header-icons">
                <div class="cart-icon" onclick="window.location.href='cart.html'">🛒<span class="cart-count" id="cartCount">0</span></div>
            </div>
        </div>
    </header>

    <div class="container" id="productContainer">Loading...</div>

    <div class="mobile-nav">
        <a href="products.html" class="nav-item"><i>🏠</i><span>Home</span></a>
        <a href="cart.html" class="nav-item"><i>🛒</i><span>Cart</span></a>
        <a href="user-chat.html" class="nav-item"><i>💬</i><span>Contact</span></a>
        <a href="profile.html" class="nav-item"><i>💻</i><span>About</span></a>
    </div>

    <div id="toastMsg" class="toast" style="display:none"></div>

    <script>
        // Mock Data (ensures functionality even without main.js)
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: "Premium Cookware Set", category: "cookware", price: 12500, quantity: 15, description: "High-quality non-stick cookware set.", images: ["https://via.placeholder.com/400?text=Cookware"], seller: "Naham Stores", sellerPhone: "+234 8036393001" },
            { id: 2, name: "Chef Knife Set", category: "cutlery", price: 8500, quantity: 8, description: "Ergonomic stainless steel knives.", images: ["https://via.placeholder.com/400?text=Knives"], seller: "Naham Stores" }
        ];
        let productReviews = JSON.parse(localStorage.getItem('productReviews')) || [];

        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2500);
        }

        function getStarRating(rating) {
            let full = Math.floor(rating);
            let half = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < full; i++) stars += '★';
            if (half) stars += '½';
            for (let i = stars.length; i < 5; i++) stars += '☆';
            return `<span style="color: var(--secondary);">${stars}</span> ${rating.toFixed(1)}`;
        }

        function addToCart(productId, qty = 1) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let existing = cart.find(item => item.id === productId);
            if (existing) existing.quantity += qty;
            else cart.push({ id: productId, quantity: qty });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showToast('✅ Added to cart!');
        }

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let total = cart.reduce((sum, i) => sum + i.quantity, 0);
            const countSpan = document.getElementById('cartCount');
            if (countSpan) countSpan.innerText = total;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));
        let currentProduct = null;

        function loadProductDetails() {
            currentProduct = products.find(p => p.id === productId);
            if (!currentProduct) {
                document.getElementById('productContainer').innerHTML = '<div class="empty-state">Product not found</div>';
                return;
            }
            const reviewsList = productReviews.filter(r => r.productId === productId);
            const avgRating = reviewsList.length ? reviewsList.reduce((a,b)=>a+b.rating,0)/reviewsList.length : 4.5;
            const html = `
                <div class="product-detail-page">
                    <div class="product-gallery">
                        <img src="${currentProduct.images[0]}" id="mainImage" class="main-img">
                        <div class="thumbnail-row">
                            ${currentProduct.images.map((img, i) => `<img src="${img}" class="thumbnail-img" onclick="changeImage(this, '${img}')">`).join('')}
                        </div>
                    </div>
                    <div>
                        <h1>${currentProduct.name}</h1>
                        <div style="color: var(--secondary); margin: 10px 0;">${getStarRating(avgRating)} (${reviewsList.length} reviews)</div>
                        <div class="price-badge">
                            <span style="font-size: 2rem; font-weight: bold; color: var(--secondary);">₦${currentProduct.price.toLocaleString()}</span>
                            ${currentProduct.originalPrice ? `<span style="text-decoration:line-through; margin-left:12px;">₦${currentProduct.originalPrice.toLocaleString()}</span>` : ''}
                        </div>
                        <p>${currentProduct.description}</p>
                        <div class="availability">✅ In Stock (${currentProduct.quantity} available)</div>
                        <div class="quantity-selector">
                            <button class="quantity-btn" onclick="changeQty(-1)">-</button>
                            <input type="number" id="qtyInput" value="1" min="1" max="${currentProduct.quantity}" style="width: 70px; text-align: center; border-radius: 30px; border:1px solid #ddd; padding: 8px;">
                            <button class="quantity-btn" onclick="changeQty(1)">+</button>
                        </div>
                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button class="btn btn-primary" onclick="addCurrentToCart()">🛒 Add to Cart</button>
                            <button class="btn btn-secondary" onclick="buyNow()">⚡ Buy Now</button>
                            <button class="btn btn-outline" onclick="openContactModal()">💬 Contact Seller</button>
                        </div>
                        <div class="seller-info">
                            <strong>🏪 ${currentProduct.seller || 'Naham Stores'}</strong><br>
                            📞 ${currentProduct.sellerPhone || '+234 803 639 3001'}<br>
                            ⭐ ${currentProduct.sellerRating || 4.8}/5
                        </div>
                    </div>
                </div>
                <div class="reviews-section">
                    <h3>📝 Customer Reviews</h3>
                    <div id="reviewsContainer"></div>
                    <button class="btn btn-outline" onclick="openReviewModal()" style="margin-top: 16px;">✍️ Write a Review</button>
                </div>
            `;
            document.getElementById('productContainer').innerHTML = html;
            loadReviews(productId);
        }

        function changeImage(el, src) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumbnail-img').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function changeQty(delta) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > currentProduct.quantity) val = currentProduct.quantity;
            input.value = val;
        }

        function addCurrentToCart() {
            const qty = parseInt(document.getElementById('qtyInput').value);
            addToCart(productId, qty);
        }

        function buyNow() {
            addCurrentToCart();
            window.location.href = 'cart.html';
        }

        function loadReviews(pid) {
            const container = document.getElementById('reviewsContainer');
            const revs = productReviews.filter(r => r.productId === pid);
            if (revs.length === 0) {
                container.innerHTML = '<p style="color: #888;">No reviews yet. Be the first to review!</p>';
                return;
            }
            container.innerHTML = revs.map(r => `
                <div style="border-bottom:1px solid #eee; padding: 16px 0;">
                    <div style="font-weight:bold;">${r.name}</div>
                    <div style="color: var(--secondary);">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                    <div style="font-weight:600; margin-top:4px;">${r.title}</div>
                    <p style="color:#555;">${r.text}</p>
                </div>
            `).join('');
        }

        function openContactModal() {
            document.getElementById('contactProductId').value = productId;
            document.getElementById('contactModal').style.display = 'flex';
        }

        function openReviewModal() {
            document.getElementById('reviewProductId').value = productId;
            document.getElementById('reviewModal').style.display = 'flex';
        }

        // Setup stars
        let selectedRating = 0;
        function setupStarSelector() {
            const container = document.getElementById('starSelector');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.textContent = '☆';
                star.style.cursor = 'pointer';
                star.onclick = () => {
                    selectedRating = i;
                    document.getElementById('ratingValue').value = i;
                    for (let s of container.children) s.textContent = '☆';
                    for (let j = 0; j < i; j++) container.children[j].textContent = '★';
                };
                container.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
            loadProductDetails();
            setupStarSelector();
        });

        // Contact form
        document.getElementById('contactForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            showToast('📧 Message sent! Seller will reply soon.');
            document.getElementById('contactModal').style.display = 'none';
            e.target.reset();
        });

        // Review submit
        document.getElementById('reviewForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!selectedRating) { showToast('Please select a rating'); return; }
            const newReview = {
                productId: parseInt(document.getElementById('reviewProductId').value),
                rating: selectedRating,
                title: document.getElementById('reviewTitle').value,
                text: document.getElementById('reviewText').value,
                name: document.getElementById('reviewerName').value
            };
            productReviews.push(newReview);
            localStorage.setItem('productReviews', JSON.stringify(productReviews));
            showToast('Thank you for your review!');
            document.getElementById('reviewModal').style.display = 'none';
            e.target.reset();
            selectedRating = 0;
            setTimeout(() => loadProductDetails(), 300);
        });

        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.onclick = () => { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); };
        });

        window.changeImage = changeImage;
        window.changeQty = changeQty;
        window.addCurrentToCart = addCurrentToCart;
        window.buyNow = buyNow;
        window.openContactModal = openContactModal;
        window.openReviewModal = openReviewModal;
    </script>

    <!-- Modals -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><span>📧 Contact Seller</span><button class="close-modal">&times;</button></div>
            <div class="modal-body">
                <form id="contactForm">
                    <input type="hidden" id="contactProductId">
                    <div class="form-group"><input type="text" id="contactName" placeholder="Your Name" required></div>
                    <div class="form-group"><input type="email" id="contactEmail" placeholder="Your Email" required></div>
                    <div class="form-group"><textarea id="contactMessage" placeholder="Your message..." rows="3" required></textarea></div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><span>✍️ Write a Review</span><button class="close-modal">&times;</button></div>
            <div class="modal-body">
                <form id="reviewForm">
                    <input type="hidden" id="reviewProductId">
                    <div class="form-group"><label>Rating</label><div id="starSelector" class="star-selector"></div><input type="hidden" id="ratingValue"></div>
                    <div class="form-group"><input type="text" id="reviewTitle" placeholder="Review Title" required></div>
                    <div class="form-group"><textarea id="reviewText" placeholder="Your review..." rows="3" required></textarea></div>
                    <div class="form-group"><input type="text" id="reviewerName" placeholder="Your Name" required></div>
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
