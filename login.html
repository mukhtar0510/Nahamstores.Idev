<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Login | Naham Stores</title>
    <style>
        /* ===== GLOBAL STYLES - MATCHING PROFILE PAGE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6a0dad;
            --primary-dark: #4b0082;
            --primary-light: #f0e6ff;
            --secondary: #E67E22;
            --secondary-light: #fdf2e6;
            --dark: #1e1e2f;
            --card-radius: 28px;
            --shadow-sm: 0 12px 28px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 20px 35px rgba(0, 0, 0, 0.1);
        }

        body {
         background-image: url(logo.png);
         background-size: cover;
           
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Login Card */
        .login-card {
            background: white;
            padding: 40px 32px;
            border-radius: var(--card-radius);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(106,13,173,0.08);
            transition: transform 0.2s;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 40px rgba(106,13,173,0.12);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .login-header h2 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .login-header p {
            color: #666;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e2e2;
            border-radius: 40px;
            font-size: 14px;
            transition: all 0.2s;
            background: #fefefe;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(106,13,173,0.1);
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(106,13,173,0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(106,13,173,0.25);
        }

        .error-msg {
            color: #e74c3c;
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--secondary);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
            .login-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo">🍳</div>
            <h2>Naham Stores Admin</h2>
            <p>Sign in to manage your store</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">🔐 Login</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
        <div class="back-link">
            <a href="products.html">← Back to Store</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').textContent = '❌ Invalid username or password (use admin / admin123)';
            }
        });
    </script>
</body>
</html>
