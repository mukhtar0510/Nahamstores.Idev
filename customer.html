<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support - Naham Stores</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container {
            background: white;
            border-radius: 24px;
            height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
        }
        .customer-message {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-radius: 20px 20px 4px 20px;
        }
        .support-message {
            background: var(--gray);
            align-self: flex-start;
            border-radius: 20px 20px 20px 4px;
        }
        .chat-input {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid #eee;
        }
        .chat-input input {
            flex: 1;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🍳 Naham Stores</div>
            <ul class="nav-links">
                <li><a href="products.html">🏠Home</a></li>
                <li><a href="cart.html">🛒Cart</a></li>
                <li><a href="profile.html">💻About</a></li>
            </ul>
            <div class="header-icons">
                <div class="cart-icon" onclick="window.location.href='cart.html'">🛒<span class="cart-count" id="cartCount">0</span></div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="chat-container">
            <div style="background: var(--primary); color: white; padding: 16px; text-align: center;">
                <h3>Customer Support</h3>
                <p>We usually reply within minutes</p>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message support-message">Hello! How can we help you today?</div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button class="btn btn-primary" id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
    <div class="mobile-nav">
        <a href="products.html" class="nav-item"><i>🏠</i><span>Home</span></a>
        <a href="cart.html" class="nav-item"><i>🛒</i><span>Cart</span></a>
         <a href="profile.html" class="nav-item"><i>💻</i><span>About</span></a>
    </div>
    
    <script src="main.js"></script>
    <script>
        let chatMessages = JSON.parse(localStorage.getItem('chatMessages')) || [
            { text: "Hello! How can we help you today?", sender: "support", timestamp: new Date() }
        ];
        
        function displayMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = chatMessages.map(msg => `
                <div class="message ${msg.sender === 'customer' ? 'customer-message' : 'support-message'}">
                    ${msg.text}
                    <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            chatMessages.push({
                text: text,
                sender: 'customer',
                timestamp: new Date()
            });
            localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
            displayMessages();
            input.value = '';
            
            setTimeout(() => {
                const replies = ["Thanks for reaching out! Our team will assist you shortly.", "Let me check that for you.", "We appreciate your patience!", "I'll help with that right away."];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                chatMessages.push({
                    text: reply,
                    sender: 'support',
                    timestamp: new Date()
                });
                localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
                displayMessages();
            }, 1500);
        }
        
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        displayMessages();
    </script>
</body>
</html>
